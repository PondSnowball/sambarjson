<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sambarJSON JavaScript Test Suite</title>
    <style>
        body { font-family: monospace; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        h1, h2, h3 { color: #569cd6; }
        .test-pass { color: #4ec9b0; }
        .test-fail { color: #f44747; }
        pre { background: #252526; padding: 15px; border-radius: 5px; border: 1px solid #3c3c3c; overflow-x: auto; }
        .box { margin-bottom: 25px; }
    </style>
</head>
<body>

    <h1>sambarJSON Browser Test Suite</h1>
    <div id="output">Running tests...</div>

    <!-- Import the sambarjson implementation -->
    <script src="sambarjson.js"></script>

    <!-- Test Runner Script -->
    <script>
        const outputDiv = document.getElementById('output');
        let htmlLog = '';

        function log(msg, className = '') {
            console.log(msg);
            htmlLog += `<div class="${className}">${msg}</div>`;
        }

        function runTest(name, func, expectedSuccess = true) {
            try {
                func();
                if (expectedSuccess) {
                    log(`[PASS] ${name}`, 'test-pass');
                } else {
                    log(`[FAIL] ${name} (Expected error, but succeeded)`, 'test-fail');
                }
            } catch (e) {
                if (!expectedSuccess) {
                    log(`[PASS] ${name} (Caught expected error: ${e.name})`, 'test-pass');
                } else {
                    log(`[FAIL] ${name} (Unexpected error: ${e.message})`, 'test-fail');
                }
            }
        }

        function runTestSuite() {
            htmlLog = '';
            
            log("=== 1. Empty & Minimal Inputs ===");
            runTest("Empty JSON Object", () => {
                const res = convertSambarjsonToJson("{}");
                if (JSON.stringify(JSON.parse(res)) !== "{}") throw new Error();
            });

            runTest("Empty RAWSTRING Block", () => {
                const inp = '{"key": __RAWSTRINGSTART____RAWSTRINGFINSIH__}';
                const res = convertSambarjsonToJson(inp);
                if (JSON.parse(res).key !== "") throw new Error();
            });

            log("<br>=== 2. RAWSTRING Edge Cases ===");
            runTest("RAWSTRING Special Characters & Escapes", () => {
                const inp = `{
  "content": __RAWSTRINGSTART__
Line 1
Line 2: "quoted" \\ path \\ t tabbed
__RAWSTRINGFINSIH__
}`;
                const res = convertSambarjsonToJson(inp);
                const data = JSON.parse(res);
                if (data.content !== 'Line 1\nLine 2: "quoted" \\ path \\ t tabbed') throw new Error();
            });

            log("<br>=== 3. Complex Nested Structures (Demo Example) ===");
            
            // Complex example containing CLASSICJSON, RAWSTRING, and SAMBARJSON blocks
            const complexInput = `{
  "id": 505,
  "config_name": __CLASSICJSONSTART__{"name": "Standard Config", "version": "1.0", "enabled": true}__CLASSICJSONFINISH__,
  "payload": __RAWSTRINGSTART__
<p>Hello "World"</p>
C:\\Users\\Admin
__RAWSTRINGFINSIH__,
  "embedded_tree": __SAMBARJSONSTART__
  {
    "sub_id": 99,
    "active": true,
    "tags": ["alpha", "beta"],
    "inner_config": __CLASSICJSONSTART__{"name": "Inner Config", "version": "A.1", "enabled": false}__CLASSICJSONFINISH__
  }
  __SAMBARJSONFINISH__
}`;

            runTest("Complex Inner Config & Nested Tree Parsing", () => {
                const jsonStr = convertSambarjsonToJson(complexInput);
                const parsed = JSON.parse(jsonStr);

                // Verification of parsed structure
                if (parsed.id !== 505) throw new Error("Mismatch in 'id'");
                if (parsed.config_name !== '{"name": "Standard Config", "version": "1.0", "enabled": true}') throw new Error("Mismatch in 'config_name'");
                if (parsed.embedded_tree.sub_id !== 99) throw new Error("Mismatch in 'embedded_tree.sub_id'");
                if (parsed.embedded_tree.tags[1] !== "beta") throw new Error("Mismatch in 'embedded_tree.tags'");
                if (parsed.embedded_tree.inner_config !== '{"name": "Inner Config", "version": "A.1", "enabled": false}') throw new Error("Mismatch in 'inner_config'");
            });

            log("<br>=== 4. Round-Trip Parity ===");
            runTest("JSON -> sambarJSON -> JSON", () => {
                const original = {
                    id: 505,
                    multiline: "Line 1\nLine 2 with \"quotes\"",
                    path: "C:\\Program Files\\App"
                };
                const jsonOrig = JSON.stringify(original);
                const sambarVersion = convertJsonToSambarjson(jsonOrig);
                const jsonBack = convertSambarjsonToJson(sambarVersion);
                
                if (JSON.stringify(JSON.parse(jsonBack)) !== jsonOrig) throw new Error("Parity mismatch");
            });

            log("<br>=== Complex Conversion Preview ===");
            const convertedOutput = convertSambarjsonToJson(complexInput);
            htmlLog += `<h3>Input sambarJSON:</h3><pre>${complexInput}</pre>`;
            htmlLog += `<h3>Converted Output JSON:</h3><pre>${convertedOutput}</pre>`;

            outputDiv.innerHTML = htmlLog;
        }

        // Run test suite on page load
        runTestSuite();
    </script>
</body>
</html>
